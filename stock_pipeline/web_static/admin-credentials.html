<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>凭据管理 - NewsCrawler</title>
    <script>
      try {
        if (localStorage.getItem("stockTheme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch {}
    </script>

      <aside class="admin-sidebar">

            <strong>NewsCrawler</strong>

          </span>
        </a>
        <nav class="admin-nav" aria-label="后台导航">
          <a href="/admin-accounts.html">

          <a href="/admin-ops.html">
            <span class="admin-nav-icon">O</span>
            <span>系统治理</span>

          <a href="/admin-market.html">

          </a>
          <a href="/admin-news.html">
            <span class="admin-nav-icon">N</span>

          </a>
          <a href="/admin-crawler.html">
            <span class="admin-nav-icon">C</span>
            <span>新闻数据</span>
          </a>
          <a class="active" href="/admin-credentials.html">
            <span class="admin-nav-icon">K</span>
