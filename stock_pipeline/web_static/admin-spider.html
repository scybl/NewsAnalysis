<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>爬虫控制台 - 价值投机分析</title>
    <script>
      try {
        if (localStorage.getItem("stockTheme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css?v=admin-unified-20260616-v1" />
  </head>
  <body>
    <main class="admin-page admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-brand" href="/">
          <span class="admin-brand-mark">VA</span>
          <span>
            <strong>价值投机分析</strong>
            <small>Admin Console</small>
          </span>
        </a>
        <nav class="admin-nav" aria-label="后台导航">
          <a href="/admin-accounts.html">
            <span class="admin-nav-icon">A</span>
            <span>账户管理</span>
          </a>
          <a class="admin-nav-unavailable" aria-disabled="true" title="Agent Gateway 调试中，暂不可用">
            <span class="admin-nav-icon">G</span>
            <span>Agent Gateway · 调试中</span>
          </a>
          <a href="/admin-archives.html">
            <span class="admin-nav-icon">R</span>
            <span>归档账号</span>
          </a>
          <a class="active" href="/admin-spider.html">
            <span class="admin-nav-icon">S</span>
            <span>爬虫控制</span>
          </a>
          <a href="/admin-news.html">
            <span class="admin-nav-icon">N</span>
            <span>数据源</span>
          </a>
          <a href="/admin-kaipanla.html">
            <span class="admin-nav-icon">K</span>
            <span>开盘啦</span>
          </a>
        </nav>
        <div class="admin-sidebar-footer">
          <a class="admin-footer-link" href="/">
            <span class="admin-nav-icon">H</span>
            <span>返回分析</span>
          </a>
          <div class="admin-footer-actions">
            <button id="themeToggleBtn" type="button">深色模式</button>
            <button id="logoutBtn" type="button">退出登录</button>
          </div>
        </div>
      </aside>

      <section class="admin-workspace">
        <header class="admin-page-head">
          <div>
            <span class="admin-kicker">CRAWLER</span>
            <h1>爬虫控制台</h1>
            <p id="spiderStatus">未读取状态</p>
          </div>
          <div class="admin-actions">
            <button id="stopSpiderBtn" type="button" disabled>停止爬虫</button>
            <button id="startSpiderBtn" class="primary-action" type="button">启动爬虫</button>
          </div>
        </header>

        <section class="admin-panel">
          <div class="spider-layout">
            <section class="admin-card spider-config-card">
              <div class="admin-card-head">
                <h4>任务配置</h4>
                <span>MongoDB</span>
              </div>
              <div class="spider-form">
                <label class="field-wide">
                  <span>数据源</span>
                  <div id="spiderSourcesSelect" class="spider-source-grid"></div>
                  <small id="spiderSourceHint" class="spider-source-hint">同花顺</small>
                </label>
                <label class="field-wide">
                  <span>分类</span>
                  <div id="spiderTypesSelect" class="spider-type-grid"></div>
                </label>
                <label class="field-wide" id="spiderStockCodeField" hidden>
                  <span>股票代码</span>
                  <input id="spiderStockCode" placeholder="例如 000001 或 000001.SZ" />
                </label>
                <label>
                  <span>页数</span>
                  <input id="spiderMaxPages" type="number" min="1" max="50" value="1" />
                </label>
                <label>
                  <span>线程</span>
                  <input id="spiderThreads" type="number" min="1" max="4" value="2" />
                </label>
                <label>
                  <span>文章间隔</span>
                  <input id="spiderArticleSleep" value="3,5" />
                </label>
                <label>
                  <span>分页间隔</span>
                  <input id="spiderPageSleep" value="5,10" />
                </label>
                <label class="check-row field-wide">
                  <input id="spiderNewOnly" type="checkbox" checked />
                  <span>只抓新增</span>
                </label>
              </div>
            </section>
            <section class="admin-card spider-state-card">
              <div class="admin-card-head">
                <h4>任务快照</h4>
                <span>全部爬虫</span>
              </div>
              <div id="spiderSourceTasks" class="spider-source-tasks"></div>
              <div class="spider-state-grid spider-snapshot-state-grid">
                <div><span>状态</span><strong id="spiderStateText">-</strong></div>
                <div><span>模式</span><strong id="spiderModeText">-</strong></div>
                <div><span>来源</span><strong id="spiderSourceText">-</strong></div>
                <div><span>分类</span><strong id="spiderTypeText">-</strong></div>
                <div><span>页数</span><strong id="spiderPagesText">-</strong></div>
              </div>
            </section>
            <section class="admin-card daily-market-card">
              <div class="admin-card-head">
                <h4>每日股票数据</h4>
                <span id="dailyMarketStatus">未启用</span>
              </div>
              <div class="spider-form">
                <label class="field-wide check-row">
                  <input id="dailyMarketEnabled" type="checkbox" />
                  <span>每日自动刷新股票列表及已有股票行情</span>
                </label>
                <label>
                  <span>北京时间</span>
                  <input id="dailyMarketTime" type="time" value="21:30" />
                </label>
                <div class="admin-actions field-wide">
                  <button id="saveDailyMarketSchedulerBtn" type="button">保存定时</button>
                  <button id="runDailyMarketNowBtn" type="button">立即执行</button>
                </div>
              </div>
              <div class="spider-state-grid daily-market-state-grid">
                <div><span>已有股票</span><strong id="dailyMarketStockCount">-</strong></div>
                <div><span>基础列表</span><strong id="dailyStockListCount">-</strong></div>
                <div><span>上次日期</span><strong id="dailyMarketLastDate">-</strong></div>
                <div><span>更新</span><strong id="dailyMarketUpdated">-</strong></div>
                <div><span>跳过</span><strong id="dailyMarketSkipped">-</strong></div>
              </div>
            </section>
            <section class="admin-card spider-log-card">
              <div class="admin-card-head">
                <h4>运行日志</h4>
                <span id="spiderLogFile">暂无日志文件</span>
              </div>
              <pre id="spiderLogs" class="spider-logs">暂无日志</pre>
            </section>
            <section class="admin-card spider-task-history-card">
              <div class="admin-card-head">
                <h4>运行记录</h4>
                <span>定时与手动任务，服务重启后保留</span>
              </div>
              <div class="admin-table-wrap">
                <table id="adminTasksTable"></table>
              </div>
            </section>
          </div>
        </section>
      </section>
    </main>
    <script src="/admin.js?v=task-history-20260619"></script>
  </body>
</html>
