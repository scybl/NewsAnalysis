    <script>
      try {
        if (localStorage.getItem("stockTheme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css?v=admin-ops-20260703-v1" />
  </head>
  <body>
    <main class="admin-page admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-brand" href="/admin-ops.html">
          <span class="admin-brand-mark">NC</span>
          <span>
            <strong>NewsCrawler</strong>

        </a>
        <nav class="admin-nav" aria-label="后台导航">
          <a href="/admin-accounts.html">
            <span class="admin-nav-icon">A</span>
            <span>账户管理</span>
          </a>
          <a class="active" href="/admin-ops.html">

          <a href="/admin-archives.html">
            <span class="admin-nav-icon">R</span>

          <a href="/admin-market.html">
            <span class="admin-nav-icon">S</span>
            <span>行情数据</span>
          </a>
          <a href="/admin-news.html">
            <span class="admin-nav-icon">N</span>
            <span>股票数据</span>
          </a>
          <a href="/admin-crawler.html">
            <span class="admin-nav-icon">C</span>
            <span>新闻数据</span>
          </a>
          <a href="/admin-credentials.html">
            <span class="admin-nav-icon">K</span>
            <span>凭据管理</span>
          </a>
          <a href="/admin-audit.html">
            <span class="admin-nav-icon">L</span>
            <span>审计日志</span>
          </a>
          <a class="admin-nav-unavailable" aria-disabled="true" title="数据分发维护中，暂不可用">
            <span class="admin-nav-icon">D</span>
            <span>数据分发 · 维护中</span>
          </a>
          <a class="admin-nav-unavailable" aria-disabled="true" title="Agent Gateway 调试中，暂不可用">
            <span class="admin-nav-icon">G</span>
            <span>Agent Gateway · 调试中</span>
          </a>
        </nav>
        <div class="admin-sidebar-footer">
          <div class="admin-footer-actions">
            <button id="themeToggleBtn" type="button">深色模式</button>
            <button id="logoutBtn" type="button">退出登录</button>
          </div>
        </div>
      </aside>

      <section class="admin-workspace">
        <header class="admin-page-head ops-page-head">
          <div>
            <span class="admin-kicker">OPS STATUS</span>
            <h1>运维状态</h1>
            <p id="opsMeta">正在读取状态...</p>
          </div>
          <div class="admin-actions">
            <button id="opsRefreshBtn" class="primary-action" type="button">刷新</button>
          </div>
        </header>

        <section class="admin-panel ops-console">
          <div id="opsSummary" class="admin-kpis ops-summary-kpis"></div>

          <section class="ops-grid">
            <section class="admin-card ops-tasks-card">
              <div class="admin-card-head">
                <div>
                  <h4>任务状态</h4>
                  <p id="opsTaskMeta">等待数据</p>
                </div>
              </div>
              <div class="admin-table-wrap ops-table-wrap">
                <table id="opsTasksTable"></table>
              </div>
            </section>

            <section class="admin-card ops-errors-card">
              <div class="admin-card-head">
                <div>
                  <h4>最近异常</h4>
                  <p id="opsErrorMeta">等待数据</p>
                </div>
              </div>
              <div id="opsErrors" class="ops-error-list"></div>
            </section>
          </section>

          <section class="admin-card ops-data-card">
            <div class="admin-card-head">
              <div>
                <h4>数据覆盖</h4>
                <p id="opsDataMeta">等待数据</p>
              </div>
            </div>
            <div id="opsData" class="ops-data-grid"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="/admin.js?v=admin-unified-20260616-v1"></script>
    <script src="/admin-ops.js?v=admin-ops-20260703-v1"></script>
