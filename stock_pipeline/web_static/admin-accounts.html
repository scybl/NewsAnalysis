<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>账户管理 - NewsCrawler</title>
    <script>
      try {
        if (localStorage.getItem("stockTheme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css?v=admin-unified-20260616-v1" />
  </head>
  <body>
    <main class="admin-page admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-brand" href="/">
          <span class="admin-brand-mark">NC</span>
          <span>
            <strong>NewsCrawler</strong>
            <small>Data Console</small>
          </span>
        </a>
        <nav class="admin-nav" aria-label="后台导航">
          <a class="active" href="/admin-accounts.html">
            <span class="admin-nav-icon">A</span>
            <span>账户管理</span>
          </a>
          <a href="/admin-ops.html">
            <span class="admin-nav-icon">O</span>
            <span>系统治理</span>
          </a>
          <a href="/admin-market.html">
            <span class="admin-nav-icon">S</span>
            <span>行情数据</span>
          </a>
          <a href="/admin-news.html">
            <span class="admin-nav-icon">N</span>
            <span>股票数据</span>
          </a>
          <a href="/admin-crawler.html">
            <span class="admin-nav-icon">C</span>
            <span>新闻数据</span>
          </a>
          <a href="/admin-credentials.html">
            <span class="admin-nav-icon">K</span>
            <span>凭据管理</span>
          </a>
          <a class="admin-nav-unavailable" aria-disabled="true" title="数据分发维护中，暂不可用">
            <span class="admin-nav-icon">D</span>
            <span>数据分发 · 维护中</span>
          </a>
          <a class="admin-nav-unavailable" aria-disabled="true" title="Agent Gateway 调试中，暂不可用">
            <span class="admin-nav-icon">G</span>
            <span>Agent Gateway · 调试中</span>
          </a>
        </nav>
        <div class="admin-sidebar-footer">
          <div class="admin-footer-actions">
            <button id="themeToggleBtn" type="button">深色模式</button>
            <button id="logoutBtn" type="button">退出登录</button>
          </div>
        </div>
      </aside>

      <section class="admin-workspace">
        <header class="admin-page-head">
          <div>
            <span class="admin-kicker">ACCESS</span>
            <h1>账户管理</h1>
            <p>管理注册账号、邀请码和已归档账号。</p>
          </div>
          <div class="admin-actions">
            <button id="createInviteBtn" class="primary-action" type="button">生成邀请码</button>
          </div>
        </header>

        <nav class="account-tabs governance-tabs" aria-label="账户管理视图">
          <button class="active" type="button" data-account-tab="accounts">用户与邀请码</button>
          <button type="button" data-account-tab="archives">归档账号</button>
        </nav>

        <div class="account-pane active" data-account-pane="accounts">
        <div class="admin-panel">
          <div class="admin-kpis">
            <div><span>注册用户</span><strong id="adminUserCount">-</strong></div>
            <div><span>可用邀请码</span><strong id="adminInviteCount">-</strong></div>
            <div><span>权限模式</span><strong>数据端</strong></div>
          </div>
          <div id="adminSummary" class="admin-summary"></div>
          <div class="admin-grid account-grid">
            <section class="admin-card account-users-card">
              <div class="admin-card-head">
                <h4>用户用量</h4>
                <span>所有注册账号</span>
              </div>
              <div class="admin-table-wrap">
                <table id="adminUsersTable"></table>
              </div>
            </section>
            <section class="admin-card">
              <div class="admin-card-head">
                <h4>邀请码</h4>
                <span>一次性，3 天内有效</span>
              </div>
              <div class="admin-table-wrap">
                <table id="adminInvitesTable"></table>
              </div>
            </section>
          </div>
        </div>
        </div>

        <div class="account-pane" data-account-pane="archives">
        <div class="admin-panel">
          <div class="admin-page-head account-archive-head">
            <div>
              <span class="admin-kicker">ARCHIVE</span>
              <h2>归档账号</h2>
              <p>查看已冻结留存的账号。这里不展示密码哈希或 API Key 密文，只展示安全摘要。</p>
            </div>
            <div class="admin-actions archive-search">
              <input id="archiveSearchInput" type="search" placeholder="搜索账号、归档人、原因..." />
              <button id="archiveSearchBtn" class="primary-action" type="button">搜索</button>
            </div>
          </div>
          <div class="admin-kpis">
            <div><span>归档总数</span><strong id="archiveTotalCount">-</strong></div>
            <div><span>注册用户</span><strong id="archiveUserCount">-</strong></div>
            <div><span>临时账号</span><strong id="archiveDemoCount">-</strong></div>
            <div><span>当前筛选</span><strong id="archiveQueryLabel">全部</strong></div>
          </div>
          <div id="archiveSummary" class="admin-summary"></div>
          <div class="admin-grid archive-grid">
            <section class="admin-card archive-card-wide">
              <div class="admin-card-head">
                <h4>归档账号</h4>
                <span>冻结但留存账号、Key 状态和用量快照</span>
              </div>
              <div class="admin-table-wrap">
                <table id="archiveUsersTable"></table>
              </div>
            </section>
          </div>
        </div>
        </div>
      </section>
    </main>
    <script src="/admin.js?v=time-archive-20260708-v1"></script>
    <script src="/admin-archives.js?v=time-archive-20260708-v1"></script>
    <script src="/admin-account-tabs.js?v=account-tabs-20260708-v1"></script>
  </body>
</html>
