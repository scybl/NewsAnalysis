<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数据源 - 价值投机分析</title>
    <script>
      try {
        if (localStorage.getItem("stockTheme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css?v=admin-unified-20260616-v1" />
  </head>
  <body>
    <main class="admin-page admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-brand" href="/">
          <span class="admin-brand-mark">VA</span>
          <span>
            <strong>价值投机分析</strong>
            <small>Admin Console</small>
          </span>
        </a>
        <nav class="admin-nav" aria-label="后台导航">
          <a href="/admin-accounts.html">
            <span class="admin-nav-icon">A</span>
            <span>账户管理</span>
          </a>
          <a class="admin-nav-unavailable" aria-disabled="true" title="Agent Gateway 调试中，暂不可用">
            <span class="admin-nav-icon">G</span>
            <span>Agent Gateway · 调试中</span>
          </a>
          <a href="/admin-archives.html">
            <span class="admin-nav-icon">R</span>
            <span>归档账号</span>
          </a>
          <a href="/admin-spider.html">
            <span class="admin-nav-icon">S</span>
            <span>爬虫控制</span>
          </a>
          <a class="active" href="/admin-news.html">
            <span class="admin-nav-icon">N</span>
            <span>数据源</span>
          </a>
          <a href="/admin-kaipanla.html">
            <span class="admin-nav-icon">K</span>
            <span>开盘啦</span>
          </a>
        </nav>
        <div class="admin-sidebar-footer">
          <a class="admin-footer-link" href="/">
            <span class="admin-nav-icon">H</span>
            <span>返回分析</span>
          </a>
          <div class="admin-footer-actions">
            <button id="themeToggleBtn" type="button">深色模式</button>
            <button id="logoutBtn" type="button">退出登录</button>
          </div>
        </div>
      </aside>

      <section class="admin-workspace">
        <header class="admin-page-head">
          <div>
            <span class="admin-kicker">DATA LIBRARY</span>
            <h1>数据源</h1>
            <p id="newsMeta">查看本地股票资料包和已爬新闻库。</p>
          </div>
          <div class="admin-actions">
            <button id="newsExportBtn" type="button">导出当前页</button>
            <button id="newsRefreshBtn" class="primary-action" type="button">刷新</button>
          </div>
        </header>

        <section class="admin-panel news-panel">
          <section class="admin-card data-source-card">
            <div class="admin-card-head">
              <h4>数据源中心</h4>
              <span id="dataSourceMeta">正在读取数据源...</span>
            </div>
            <div id="dataSourceStats" class="admin-kpis news-kpis"></div>
            <div id="dataSourceProviders" class="data-source-provider-grid"></div>
          </section>

          <section class="admin-card standard-data-card">
            <div class="admin-card-head">
              <h4>标准数据类型</h4>
              <span>分析层只读取这些统一类型</span>
            </div>
            <div class="admin-table-wrap">
              <table id="standardDataTable"></table>
            </div>
          </section>

          <section class="admin-card stock-data-card">
            <div class="admin-card-head">
              <h4>本地股票数据</h4>
              <span id="stockDataMeta">正在读取本地资料包...</span>
            </div>
            <div id="stockDataStats" class="admin-kpis news-kpis"></div>
            <div class="news-filter-grid stock-data-filter-grid">
              <label class="news-search-field">
                <span>搜索股票</span>
                <input id="stockDataSearchInput" type="search" placeholder="代码、名称、行业" />
              </label>
              <label>
                <span>排序</span>
                <select id="stockDataSortSelect">
                  <option value="updated_at" selected>最近更新</option>
                  <option value="ts_code">股票代码</option>
                  <option value="dataset_count">数据集数量</option>
                  <option value="minute_rows">分钟行数</option>
                </select>
              </label>
            </div>
            <div class="admin-table-wrap stock-data-table-wrap">
              <table id="stockDataTable"></table>
            </div>
          </section>

          <section class="admin-card kaipanla-card">
            <div class="admin-card-head">
              <h4>开盘啦数据源</h4>
              <span id="kaipanlaMeta">正在读取功能列表...</span>
            </div>
            <div class="news-filter-grid kaipanla-control-grid">
              <label class="news-search-field">
                <span>功能</span>
                <select id="kaipanlaFeatureSelect"></select>
              </label>
              <button id="kaipanlaValidateBtn" type="button">验证集成</button>
              <button id="kaipanlaRunBtn" class="primary-action" type="button">运行</button>
            </div>
            <label class="kaipanla-param-field">
              <span>参数 JSON</span>
              <textarea id="kaipanlaParamsInput" rows="5" spellcheck="false"></textarea>
            </label>
            <pre id="kaipanlaOutput" class="agent-code-sample kaipanla-output">等待运行。</pre>
          </section>

          <div id="newsStats" class="admin-kpis news-kpis"></div>
          <div id="newsDistribution" class="news-distribution"></div>

          <section class="admin-card news-browser-card">
            <div class="admin-card-head">
              <h4>新闻列表</h4>
              <span>筛选与分页</span>
            </div>
            <div class="news-filter-grid">
              <label class="news-search-field">
                <span>搜索</span>
                <input id="newsSearchInput" type="search" placeholder="标题、正文、来源" />
              </label>
              <label>
                <span>来源</span>
                <select id="newsPublisherSelect"></select>
              </label>
              <label>
                <span>分类</span>
                <select id="newsTypeSelect"></select>
              </label>
              <label>
                <span>时间</span>
                <select id="newsDaysSelect">
                  <option value="1">最近 1 天</option>
                  <option value="7">最近 7 天</option>
                  <option value="30" selected>最近 30 天</option>
                  <option value="90">最近 90 天</option>
                  <option value="0">全部</option>
                </select>
              </label>
              <label>
                <span>每页</span>
                <select id="newsPageSizeSelect">
                  <option value="20" selected>20</option>
                  <option value="40">40</option>
                  <option value="80">80</option>
                </select>
              </label>
              <button id="newsResetBtn" type="button">重置筛选</button>
            </div>

            <div id="newsList" class="news-list"></div>

            <div class="news-pager">
              <button id="newsPrevBtn" type="button">上一页</button>
              <span id="newsPageInfo">第 1 页</span>
              <button id="newsNextBtn" type="button">下一页</button>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script src="/admin.js?v=admin-unified-20260616-v1"></script>
    <script src="/admin-news.js?v=admin-unified-20260616-v1"></script>
  </body>
</html>
