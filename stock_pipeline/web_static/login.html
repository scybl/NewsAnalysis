<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - NewsCrawler</title>
    <script>
      try {
        if (localStorage.getItem("stockTheme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch {}
    </script>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17202a;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% -10%, rgba(148, 163, 184, 0.24), transparent 30%),
          #f8fafc;
      }

      main {
        position: relative;
        width: min(500px, 100%);
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        padding: 32px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 24px 70px rgba(15, 23, 42, 0.10);
        overflow: hidden;
        backdrop-filter: blur(18px);
      }

      main::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: #0f172a;
      }

      .login-theme-toggle {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 1;
        width: auto;
        height: 34px;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        padding: 0 12px;
        background: rgba(255, 255, 255, 0.9);
        color: #0f172a;
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      .login-theme-toggle:hover {
        background: #f1f5f9;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: -0.055em;
      }

      p {
        margin: 8px 0 22px;
        color: #667085;
        font-size: 14px;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 18px;
      }

      .tab {
        height: 42px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        background: #ffffff;
        color: #344054;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      .tab.active {
        background: #0f172a;
        border-color: #0f172a;
        color: #fff;
        box-shadow: 0 16px 34px rgba(59, 130, 246, 0.24);
      }

      form[hidden] {
        display: none;
      }

      label {
        display: grid;
        gap: 8px;
        margin-top: 14px;
        color: #475467;
        font-size: 14px;
      }

      input {
        width: 100%;
        height: 46px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0 14px;
        background: #ffffff;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: #2f80ed;
        box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.12);
      }

      button.submit {
        width: 100%;
        height: 46px;
        margin-top: 20px;
        border: 0;
        border-radius: 10px;
        background: #0f172a;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      button.secondary {
        width: 100%;
        height: 40px;
        margin-top: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        background: #ffffff;
        color: #475467;
        font: inherit;
        cursor: pointer;
      }

      .admin-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0 2px;
      }

      .admin-heading > span:last-child {
        min-width: 0;
      }

      .admin-heading strong {
        display: block;
        font-size: 17px;
      }

      .admin-heading span:last-child {
        color: #667085;
        font-size: 13px;
      }

      .admin-mark {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        place-items: center;
        border-radius: 10px;
        background: #0f172a;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .message {
        min-height: 20px;
        margin-top: 12px;
        color: #c0392b;
        font-size: 13px;
      }

      html.theme-dark {
        color-scheme: dark;
        color: #e6edf3;
        background: #0f141b;
      }

      html.theme-dark body {
        background: #0f141b;
      }

      html.theme-dark main {
        background: #111821;
        border-color: #2b3645;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      html.theme-dark .login-theme-toggle {
        background: rgba(21, 31, 43, 0.92);
        border-color: #344154;
        color: #e6edf3;
      }

      html.theme-dark .login-theme-toggle:hover {
        background: #1c2938;
      }

      html.theme-dark p,
      html.theme-dark label {
        color: #9aa7b5;
      }

      html.theme-dark .tab,
      html.theme-dark input,
      html.theme-dark button.secondary {
        background: #151f2b;
        border-color: #344154;
        color: #e6edf3;
      }

      html.theme-dark .tab.active,
      html.theme-dark button.submit,
      html.theme-dark .admin-mark {
        background: #e6edf3;
        border-color: #e6edf3;
        color: #0f141b;
      }

      html.theme-dark .message {
        color: #ff9a9a;
      }
    </style>
  </head>
  <body>
    <main>
      <button class="login-theme-toggle" id="loginThemeToggleBtn" type="button" aria-pressed="false">深色模式</button>
      <h1>NewsCrawler</h1>
      <p id="pageSubtitle">新闻数据与运行观测平台</p>

      <div class="tabs" id="authTabs" role="tablist" aria-label="认证方式">
        <button class="tab active" id="loginTab" type="button">登录</button>
        <button class="tab" id="registerTab" type="button">注册</button>
      </div>

      <form id="loginForm">
        <label>
          <span>账号</span>
          <input id="loginUsername" name="username" autocomplete="username" required />
        </label>
        <label>
          <span>密码</span>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="submit" id="loginBtn" type="submit">登录</button>
      </form>

      <form id="adminLoginForm" hidden>
        <div class="admin-heading">
          <span class="admin-mark" aria-hidden="true">A</span>
          <span>
            <strong>管理员验证</strong>
            <span>请输入真实管理员凭据与动态验证码</span>
          </span>
        </div>
        <input id="adminChallenge" name="admin_challenge" type="hidden" />
        <label>
          <span>管理员账号</span>
          <input id="adminUsername" name="username" autocomplete="username" value="admin" required />
        </label>
        <label>
          <span>管理员密码</span>
          <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />
        </label>
        <label>
          <span>Authenticator 验证码</span>
          <input id="adminOtp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="6 位数字" required />
        </label>
        <button class="submit" id="adminLoginBtn" type="submit">验证并登录</button>
        <button class="secondary" id="backToLoginBtn" type="button">返回普通登录</button>
      </form>

      <form id="registerForm" hidden>
        <label>
          <span>账号</span>
          <input id="registerUsername" name="username" autocomplete="username" minlength="3" maxlength="32" required />
        </label>
        <label>
          <span>密码</span>
          <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          <span>邀请码</span>
          <input id="inviteCode" name="invite_code" autocomplete="off" required />
        </label>
        <button class="submit" id="registerBtn" type="submit">创建账号</button>
      </form>

      <div id="message" class="message"></div>
    </main>
    <script>
      const loginTab = document.querySelector("#loginTab");
      const registerTab = document.querySelector("#registerTab");
      const authTabs = document.querySelector("#authTabs");
      const pageSubtitle = document.querySelector("#pageSubtitle");
      const loginForm = document.querySelector("#loginForm");
      const adminLoginForm = document.querySelector("#adminLoginForm");
      const registerForm = document.querySelector("#registerForm");
      const message = document.querySelector("#message");
      const loginThemeToggleBtn = document.querySelector("#loginThemeToggleBtn");

      function syncLoginThemeToggle() {
        const isDark = document.documentElement.classList.contains("theme-dark");
        loginThemeToggleBtn.textContent = isDark ? "浅色模式" : "深色模式";
        loginThemeToggleBtn.setAttribute("aria-pressed", String(isDark));
      }

      loginThemeToggleBtn.addEventListener("click", () => {
        const nextTheme = document.documentElement.classList.contains("theme-dark") ? "light" : "dark";
        document.documentElement.classList.toggle("theme-dark", nextTheme === "dark");
        try {
          localStorage.setItem("stockTheme", nextTheme);
        } catch {}
        syncLoginThemeToggle();
      });

      syncLoginThemeToggle();

      function setMode(mode) {
        const isLogin = mode === "login";
        loginTab.classList.toggle("active", isLogin);
        registerTab.classList.toggle("active", !isLogin);
        authTabs.hidden = false;
        loginForm.hidden = !isLogin;
        adminLoginForm.hidden = true;
        registerForm.hidden = isLogin;
        pageSubtitle.textContent = "新闻数据与运行观测平台";
        message.textContent = "";
      }

      function showAdminLogin(challenge) {
        authTabs.hidden = true;
        loginForm.hidden = true;
        registerForm.hidden = true;
        adminLoginForm.hidden = false;
        document.querySelector("#adminChallenge").value = challenge;
        document.querySelector("#adminPassword").value = "";
        document.querySelector("#adminOtp").value = "";
        pageSubtitle.textContent = "管理员安全登录 · TOTP 二次验证";
        message.textContent = "";
        document.querySelector("#adminPassword").focus();
      }

      async function submitJson(path, form, button) {
        button.disabled = true;
        message.textContent = "";
        try {
          const body = Object.fromEntries(new FormData(form).entries());
          const response = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const payload = await response.json();
          if (!payload.ok) throw new Error(payload.error || "操作失败");
          window.location.href = "/";
        } catch (err) {
          message.textContent = err.message;
        } finally {
          button.disabled = false;
        }
      }

      loginTab.addEventListener("click", () => setMode("login"));
      registerTab.addEventListener("click", () => setMode("register"));
      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = document.querySelector("#loginUsername").value;
        const password = document.querySelector("#loginPassword").value;
        if (username === "admin" && password === "admin") {
          const button = document.querySelector("#loginBtn");
          button.disabled = true;
          message.textContent = "";
          try {
            const response = await fetch("/api/admin-login-entry", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            const payload = await response.json();
            if (!payload.ok) throw new Error(payload.error || "管理员入口验证失败");
            showAdminLogin(payload.admin_challenge);
          } catch (err) {
            message.textContent = err.message;
          } finally {
            button.disabled = false;
          }
          return;
        }
        submitJson("/api/login", loginForm, document.querySelector("#loginBtn"));
      });
      adminLoginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        submitJson("/api/login", adminLoginForm, document.querySelector("#adminLoginBtn"));
      });
      document.querySelector("#backToLoginBtn").addEventListener("click", () => {
        loginForm.reset();
        setMode("login");
      });
      registerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        submitJson("/api/register", registerForm, document.querySelector("#registerBtn"));
      });
    </script>
  </body>
</html>
