<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - 价值投机分析</title>
    <script>
      try {
        if (localStorage.getItem("stockTheme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch {}
    </script>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17202a;
        background: #f6f7f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(460px, 100%);
        border: 1px solid #e4e7ec;
        border-radius: 8px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 12px 30px rgba(23, 32, 42, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 26px;
      }

      p {
        margin: 8px 0 22px;
        color: #667085;
        font-size: 14px;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 18px;
      }

      .tab {
        height: 38px;
        border: 1px solid #cfd6df;
        border-radius: 6px;
        background: #fff;
        color: #344054;
        font: inherit;
        cursor: pointer;
      }

      .tab.active {
        background: #17202a;
        border-color: #17202a;
        color: #fff;
      }

      form[hidden] {
        display: none;
      }

      label {
        display: grid;
        gap: 8px;
        margin-top: 14px;
        color: #475467;
        font-size: 14px;
      }

      input {
        width: 100%;
        height: 42px;
        border: 1px solid #cfd6df;
        border-radius: 6px;
        padding: 0 12px;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: #2f80ed;
        box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.12);
      }

      button.submit {
        width: 100%;
        height: 42px;
        margin-top: 20px;
        border: 1px solid #17202a;
        border-radius: 6px;
        background: #17202a;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .notice {
        margin-top: 18px;
        padding: 12px;
        border: 1px solid #e4e7ec;
        border-radius: 6px;
        background: #f9fafb;
        color: #667085;
        font-size: 13px;
        line-height: 1.55;
      }

      .message {
        min-height: 20px;
        margin-top: 12px;
        color: #c0392b;
        font-size: 13px;
      }

      html.theme-dark {
        color-scheme: dark;
        color: #e6edf3;
        background: #0f141b;
      }

      html.theme-dark body {
        background: #0f141b;
      }

      html.theme-dark main {
        background: #111821;
        border-color: #2b3645;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      html.theme-dark p,
      html.theme-dark label {
        color: #9aa7b5;
      }

      html.theme-dark .tab,
      html.theme-dark input {
        background: #151f2b;
        border-color: #344154;
        color: #e6edf3;
      }

      html.theme-dark .tab.active,
      html.theme-dark button.submit {
        background: #e6edf3;
        border-color: #e6edf3;
        color: #0f141b;
      }

      html.theme-dark .notice {
        background: #151f2b;
        border-color: #344154;
        color: #9aa7b5;
      }

      html.theme-dark .message {
        color: #ff9a9a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>价值投机</h1>
      <p>登录或使用邀请码创建账号</p>

      <div class="tabs" role="tablist" aria-label="认证方式">
        <button class="tab active" id="loginTab" type="button">登录</button>
        <button class="tab" id="registerTab" type="button">注册</button>
      </div>

      <form id="loginForm">
        <label>
          <span>账号</span>
          <input id="loginUsername" name="username" autocomplete="username" required />
        </label>
        <label>
          <span>密码</span>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="submit" id="loginBtn" type="submit">登录</button>
      </form>

      <form id="registerForm" hidden>
        <label>
          <span>账号</span>
          <input id="registerUsername" name="username" autocomplete="username" minlength="3" maxlength="32" required />
        </label>
        <label>
          <span>密码</span>
          <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          <span>邀请码</span>
          <input id="inviteCode" name="invite_code" autocomplete="off" required />
        </label>
        <button class="submit" id="registerBtn" type="submit">创建账号</button>
      </form>

      <div id="message" class="message"></div>
      <div class="notice">
        朋友测试账号由管理员生成，默认有请求次数限制。注册只接受管理员生成的邀请码。
      </div>
    </main>
    <script>
      const loginTab = document.querySelector("#loginTab");
      const registerTab = document.querySelector("#registerTab");
      const loginForm = document.querySelector("#loginForm");
      const registerForm = document.querySelector("#registerForm");
      const message = document.querySelector("#message");

      function setMode(mode) {
        const isLogin = mode === "login";
        loginTab.classList.toggle("active", isLogin);
        registerTab.classList.toggle("active", !isLogin);
        loginForm.hidden = !isLogin;
        registerForm.hidden = isLogin;
        message.textContent = "";
      }

      async function submitJson(path, form, button) {
        button.disabled = true;
        message.textContent = "";
        try {
          const body = Object.fromEntries(new FormData(form).entries());
          const response = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const payload = await response.json();
          if (!payload.ok) throw new Error(payload.error || "操作失败");
          window.location.href = "/";
        } catch (err) {
          message.textContent = err.message;
        } finally {
          button.disabled = false;
        }
      }

      loginTab.addEventListener("click", () => setMode("login"));
      registerTab.addEventListener("click", () => setMode("register"));
      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        submitJson("/api/login", loginForm, document.querySelector("#loginBtn"));
      });
      registerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        submitJson("/api/register", registerForm, document.querySelector("#registerBtn"));
      });
    </script>
  </body>
</html>
