  <body>
    <main class="admin-page admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-brand" href="/">
          <span class="admin-brand-mark">VA</span>
          <span>
            <strong>价值投机分析</strong>
            <small>Admin Console</small>
          </span>
        </a>
        <nav class="admin-nav" aria-label="后台导航">
          <a href="/admin-accounts.html">
            <span class="admin-nav-icon">A</span>
            <span>账户管理</span>
          </a>
          <a href="/admin-agent.html">
            <span class="admin-nav-icon">G</span>
            <span>Agent Gateway</span>
          </a>
          <a class="active" href="/admin-archives.html">

            <span>归档账号</span>

          <a href="/admin-spider.html">

            <span>爬虫控制</span>

          <a href="/admin-news.html">

            <span>新闻数据</span>
          </a>
        </nav>
        <div class="admin-sidebar-footer">
          <a class="admin-footer-link" href="/">
            <span class="admin-nav-icon">H</span>
            <span>返回分析</span>
          </a>
          <div class="admin-footer-actions">
            <button id="themeToggleBtn" type="button">深色模式</button>
            <button id="logoutBtn" type="button">退出登录</button>
          </div>
        </div>
      </aside>

      <section class="admin-workspace">
        <header class="admin-page-head">
          <div>
            <span class="admin-kicker">ARCHIVE</span>
            <h1>归档账号</h1>
            <p>查看已冻结留存的账号。这里不展示密码哈希或 API Key 密文，只展示安全摘要。</p>

            <input id="archiveSearchInput" type="search" placeholder="搜索账号、归档人、原因..." />

          </div>
        </header>

        <div class="admin-panel">

            <div><span>注册用户</span><strong id="archiveUserCount">-</strong></div>
            <div><span>测试账号</span><strong id="archiveDemoCount">-</strong></div>
            <div><span>当前筛选</span><strong id="archiveQueryLabel">全部</strong></div>
          </div>
          <div id="archiveSummary" class="admin-summary"></div>

                <table id="archiveDemoAccountsTable"></table>
              </div>
            </section>
          </div>
