name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: CI / hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Reject tracked secrets and runtime data
        shell: bash
        run: |
          sensitive_files="$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.deploy\.env$|(^|/)\.ssh/|(^|/)\.aws/|\.(pem|key|p12|pfx|db|sqlite|sqlite3)$' || true)"
          if [[ -n "$sensitive_files" ]]; then
            echo "Sensitive or runtime files must not be tracked:" >&2
            echo "$sensitive_files" >&2
            exit 1
          fi

      - name: Validate Python and shell syntax
        shell: bash
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile
          git ls-files -z 'scripts/*.sh' | xargs -0 -n1 bash -n

  tests:
    name: CI / tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test ValueScope DataHub and NewsCrawler
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e './NewsCrawler[dev]'
          python -m pytest -q tests NewsCrawler/tests

  frontend_contract:
    name: CI / frontend-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Validate generated CSS
        run: |
          npm ci
          ./node_modules/.bin/tailwindcss \
            -i frontend/admin/tailwind.input.css \
            -o /tmp/valuescope-tailwind.css
          test -s /tmp/valuescope-tailwind.css

  compose:
    name: CI / compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate production Compose
        env:
          MONGO_PASSWORD: ci-password
          MONGO_PASSWORD_URI: ci-password
        run: |
          cp .env.deploy.sample .env
          docker compose -f docker-compose.prod.yml config --quiet

  docker_build:
    name: CI / docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build production images
        run: |
          docker build --tag valuescope:ci .
          docker build --tag news-crawler:ci ./NewsCrawler

  validate:
    name: CI / validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [hygiene, tests, frontend_contract, compose, docker_build]
    if: always()
    steps:
      - name: Require split CI jobs
        shell: bash
        run: |
          test "${{ needs.hygiene.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.frontend_contract.result }}" = "success"
          test "${{ needs.compose.result }}" = "success"
          test "${{ needs.docker_build.result }}" = "success"
