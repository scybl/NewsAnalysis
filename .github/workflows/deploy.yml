name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Check deployment secrets
        id: deployment_secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          test -n "$DEPLOY_HOST" || missing+=("DEPLOY_HOST")
          test -n "$DEPLOY_SSH_KEY" || missing+=("DEPLOY_SSH_KEY")
          test -n "$DEPLOY_KNOWN_HOSTS" || missing+=("DEPLOY_KNOWN_HOSTS")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            printf 'Production deployment skipped because these secrets are not configured: %s\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            printf '::notice::Production deployment skipped because these secrets are not configured: %s\n' "${missing[*]}"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.deployment_secrets.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Safe sync and activate when idle
        if: steps.deployment_secrets.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          export DEPLOY_PORT="${DEPLOY_PORT:-22}"
          export DEPLOY_PATH="${DEPLOY_PATH:-/opt/newsanalysis}"
          export DEPLOY_HEALTH_URL="${DEPLOY_HEALTH_URL:-http://127.0.0.1:8765/api/health}"
          export DEPLOY_USER="${DEPLOY_USER:-root}"
          export DEPLOY_PROTECT_RUNNING_JOBS=1
          export DEPLOY_FORCE_RESTART=0
          export DEPLOY_SKIP_RESTART=0
          scripts/deploy_server.sh
