services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_password
    volumes:
      - ./local_data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build: .
    labels:
      com.newsanalysis.release: ${RELEASE_VERSION:-unknown}
      com.newsanalysis.release-time: ${RELEASE_TIME:-unknown}
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      STOCK_WEB_HOST: 0.0.0.0
      STOCK_WEB_PORT: 8765
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-news}
      MONGODB_RAW_COLLECTION: ${MONGODB_RAW_COLLECTION:-raw_articles}
      STOCK_ANALYSIS_PROJECT_DIR: /Analysis
      RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
      RELEASE_TIME: ${RELEASE_TIME:-unknown}
    ports:
      - "${PUBLIC_WEB_PORT:-8765}:8765"
    volumes:
      - ./cache:/app/cache
      - ./local_data:/app/local_data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./sessions:/app/sessions
      - ../Analysis:/Analysis:ro

  news-crawler:
    build:
      context: ./NewsCrawler
    labels:
      com.newsanalysis.release: ${RELEASE_VERSION:-unknown}
      com.newsanalysis.release-time: ${RELEASE_TIME:-unknown}
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGODB_DATABASE: ${MONGODB_DATABASE:-news}
      MONGODB_RAW_COLLECTION: ${MONGODB_RAW_COLLECTION:-raw_articles}
      MONGODB_RUNS_COLLECTION: ${MONGODB_RUNS_COLLECTION:-crawl_runs}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-}
      BLOOMBERG_COOKIE: ${BLOOMBERG_COOKIE:-}
      NEWS_CRAWLER_DISABLED_SOURCES: ${NEWS_CRAWLER_DISABLED_SOURCES:-bloomberg}
      NEWS_CRAWLER_TONGHUASHUN_CATEGORY_PAGES: ${NEWS_CRAWLER_TONGHUASHUN_CATEGORY_PAGES:-产经新闻=30,区域经济=18,公司新闻=16,国际财经=12,财经评论=6,财经要闻=5,宏观经济=3,金融市场=3,财经人物=2}
    secrets:
      - mongo_root_password
    command: ["schedule", "--source", "all", "--interval", "${NEWS_CRAWLER_INTERVAL_SECONDS:-1800}", "--max-pages", "${NEWS_CRAWLER_MAX_PAGES:-10}"]
    healthcheck:
      test: ["CMD", "news-crawler", "health"]
      interval: 60s
      timeout: 15s
      retries: 3

secrets:
  mongo_root_password:
    file: ./local_data/secure/mongo_root_password.txt
