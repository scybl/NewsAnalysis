services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_password
    volumes:
      - ./local_data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build: .
    labels:
      com.newsanalysis.release: ${RELEASE_VERSION:-unknown}
      com.newsanalysis.release-time: ${RELEASE_TIME:-unknown}
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      STOCK_WEB_HOST: 0.0.0.0
      STOCK_WEB_PORT: 8765
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-news}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION:-articles}
      RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
      RELEASE_TIME: ${RELEASE_TIME:-unknown}
    ports:
      - "${PUBLIC_WEB_PORT:-8765}:8765"
    volumes:
      - ./cache:/app/cache
      - ./local_data:/app/local_data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./sessions:/app/sessions

secrets:
  mongo_root_password:
    file: ./local_data/secure/mongo_root_password.txt
