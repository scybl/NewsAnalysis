[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-crawler"
version = "1.1.0"
description = "Independent news collection service for NewsAnalysis"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pymongo>=4.6",
  "requests>=2.31",
]

[project.optional-dependencies]
bloomberg = ["curl-cffi>=0.6.0"]
browser = ["selenium>=4.20"]
dev = ["pytest>=8.0"]

[project.scripts]
news-crawler = "news_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
