[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsanalysis-mcp"
version = "0.1.0"
description = "Thin MCP wrapper for the NewsAnalysis Agent Gateway"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.25.0",
  "mcp>=1.0.0",
]

[project.scripts]
newsanalysis-mcp = "newsanalysis_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
